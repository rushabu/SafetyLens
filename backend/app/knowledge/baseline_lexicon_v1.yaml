# Hazard categories reported under "other hazards" (outside the LSR list).
hazard_to_other:
  slip_trip_same_level: OH-SLIP_TRIP
  manual_handling_strain: OH-MANUAL_HANDLING
  chemical_contact: OH-CHEMICAL
  environmental_release: OH-ENVIRONMENT
# Mapped to other hazards ONLY when the related LSR is not tagged.
hazard_to_other_unless_rule:
  hazardous_atmosphere: {other: OH-TOXIC_GAS, unless: [LSR-02]}
  fire_explosion: {other: OH-FIRE, unless: [LSR-05]}
  pressure_release: {other: OH-PRESSURE, unless: [LSR-04, LSR-06]}
  electrical_shock: {other: OH-ELECTRICAL, unless: [LSR-04]}
